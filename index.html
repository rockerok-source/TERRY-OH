<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Inno Trade" />
  <title>Inno Trade 모바일 웹앱</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">MOBILE WEB APP</p>
        <h1>Inno Trade</h1>
      </div>
      <span id="statusBadge" class="badge">준비됨</span>
    </header>

    <main class="app-main">
      <section class="card">
        <h2>빠른 메모 / 체크리스트</h2>
        <p class="muted">아이폰에서 바로 확인하거나 기록할 항목을 추가해 보세요. (브라우저에 자동 저장됩니다)</p>

        <form id="noteForm" class="input-row">
          <input
            id="noteInput"
            type="text"
            placeholder="예: 부품 재고 확인, 발주 내역..."
            autocomplete="off"
            required
          />
          <button type="submit" class="btn-primary">추가</button>
        </form>

        <ul id="noteList" class="note-list"></ul>
      </section>

      <section class="card">
        <h2>아이폰 홈 화면 설치 방법</h2>
        <ol class="guide-list">
          <li>아이폰 <strong>Safari</strong>에서 배포된 GitLab Pages 주소로 접속합니다.</li>
          <li>하단 중앙의 <strong>공유 버튼(□↑)</strong>을 누릅니다.</li>
          <li><strong>[홈 화면에 추가]</strong>를 선택하면 앱 아이콘이 생성됩니다.</li>
        </ol>
      </section>
    </main>

    <footer class="app-footer">
      <button id="clearAllBtn" type="button" class="btn-ghost">전체 지우기</button>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
